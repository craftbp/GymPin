name: Build APK

# Every push builds a signed APK (Artifacts: TricFit-apk).
# Actions → Build APK → Run workflow → "kiadas" bepipálva: a Releases oldalra is kiteszi
# (ott van a nyilvános letöltési link, amit a klienseknek küldhetsz).

on:
  push:
    paths:
      - 'TricFit_android.zip'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:
    inputs:
      kiadas:
        description: 'Kiadás a Releases oldalra (letöltési link)'
        type: boolean
        default: false
      megjegyzes:
        description: 'Mi változott (a kiadás leírása)'
        type: string
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Unzip project
        run: |
          if [ ! -f TricFit_android.zip ]; then
            echo "::error::Upload TricFit_android.zip to the root of the repository"
            exit 1
          fi
          unzip -q -o TricFit_android.zip

      # The Hungarian exercise texts (hand translation) are inside the zip:
      # TricFit/app/src/main/assets/www/exercises_text.js – a file in the repository root is ignored.

      - name: Signing key from secrets
        env:
          KS_B64: ${{ secrets.TRICFIT_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.TRICFIT_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.TRICFIT_KEY_ALIAS }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then
            echo "::error::Hiányzik a TRICFIT_KEYSTORE_B64 / TRICFIT_KEYSTORE_PASSWORD secret (Settings → Secrets and variables → Actions)"
            exit 1
          fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/tricfit.keystore"
          echo "TRICFIT_KEYSTORE_FILE=$RUNNER_TEMP/tricfit.keystore" >> "$GITHUB_ENV"
          echo "TRICFIT_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          echo "TRICFIT_KEY_ALIAS=${KS_ALIAS:-tricfit}" >> "$GITHUB_ENV"

      - name: Install SDK 35 and build
        working-directory: TricFit
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          VER="1.0.${GITHUB_RUN_NUMBER}"
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/TricFit-${VER}.apk"
          echo "VER=$VER" >> "$GITHUB_ENV"
          rm -f "$TRICFIT_KEYSTORE_FILE"

      - uses: actions/upload-artifact@v4
        with:
          name: TricFit-apk
          path: dist/*.apk

      - name: Publish release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.kiadas }}
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.megjegyzes }}
        run: |
          gh release create "v${VER}" "dist/TricFit-${VER}.apk" \
            --title "TricFit ${VER}" \
            --notes "${NOTES:-TricFit ${VER}}" \
            --latest
