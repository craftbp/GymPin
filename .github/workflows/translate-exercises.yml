name: Build APK

on:
  push:
    paths:
      - 'TricFit_android.zip'
      - 'exercises_text.js'
      - '.github/workflows/build-apk.yml'
  workflow_run:
    workflows: ["Translate exercises"]
    types: [completed]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Unzip project
        run: |
          if [ ! -f TricFit_android.zip ]; then
            echo "::error::Upload TricFit_android.zip to the root of the repository"
            exit 1
          fi
          unzip -q -o TricFit_android.zip

      - name: Add offline exercise texts
        run: |
          if [ -f exercises_text.js ]; then
            cp exercises_text.js TricFit/app/src/main/assets/www/
            echo "exercises_text.js beépítve"
          else
            echo "::warning::Nincs exercises_text.js – futtasd a Translate exercises workflow-t a magyar leírásokhoz"
          fi

      - name: Install SDK 35 and build
        working-directory: TricFit
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0"
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: TricFit-apk
          path: TricFit/app/build/outputs/apk/debug/*.apk
